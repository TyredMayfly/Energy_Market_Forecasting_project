version: '3.8'

services:
  # FastAPI backend service
  api:
    build:
      context: .
      target: api
    container_name: market-forecasting-api
    ports:
      - "8000:8000"
    environment:
      - ENTSOE_API_KEY=${ENTSOE_API_KEY}
      - KNMI_API_KEY=${KNMI_API_KEY}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - forecasting-network

  # Streamlit frontend service
  streamlit:
    build:
      context: .
      target: streamlit
    container_name: market-forecasting-ui
    ports:
      - "8501:8501"
    environment:
      - ENTSOE_API_KEY=${ENTSOE_API_KEY}
      - KNMI_API_KEY=${KNMI_API_KEY}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - forecasting-network

networks:
  forecasting-network:
    driver: bridge

volumes:
  data:
