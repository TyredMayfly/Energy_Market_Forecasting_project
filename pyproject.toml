[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-forecasting"
version = "0.1.0"
description = "Educational power market forecasting app for the Netherlands"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Market Forecasting Team" }
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "black>=23.10.0",
    "apscheduler>=3.10.0",
    "pytz>=2023.3",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "lxml>=4.9.0",
    "plotly>=5.17.0",
    "netCDF4>=1.6.0",
    "xarray>=2023.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["app"]
